apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 66.2.1
    helm:
      valuesObject:
        prometheus:
          prometheusSpec:
            # Pick up every ServiceMonitor / PrometheusRule, not just ones labelled with the release.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 2d
        grafana:
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
        alertmanager:
          alertmanagerSpec:
            retention: 24h
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The stack's CRDs are too large for client-side apply.
      - ServerSideApply=true
