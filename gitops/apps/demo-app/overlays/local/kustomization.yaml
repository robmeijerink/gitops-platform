apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# `task app:load` builds this image and loads it into kind, so no registry is needed locally.
images:
  - name: ghcr.io/robmeijerink/gitops-platform/demo-app
    newName: demo-app
    newTag: local
patches:
  - target:
      kind: Deployment
      name: demo-app
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
