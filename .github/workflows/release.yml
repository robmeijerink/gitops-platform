name: Release Demo App

on:
  push:
    branches: [main]
    paths: ["apps/demo-app/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log In to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: apps/demo-app
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/demo-app:${{ github.sha }}
            ghcr.io/${{ github.repository }}/demo-app:latest
