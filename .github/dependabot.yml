version: 2
updates:
  - package-ecosystem: terraform
    directory: /infra/environments/local
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /apps/demo-app
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/apps/demo-app, /.devcontainer]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
